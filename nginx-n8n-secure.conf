# ----------------------------------------------------------------------
# TAVARDT Elite n8n Nginx Reverse Proxy Configuration
# ----------------------------------------------------------------------
# Description: n8n runs internally on port 5678. This Nginx block acts as
# the secure public gateway, protecting both the editor and webhooks.
#
# CRITICAL: n8n's web interface must NEVER be exposed directly to the internet.
# ----------------------------------------------------------------------

# Rate limiting zone for the admin editor (prevent brute force)
# Define this OUTSIDE the server block:
# limit_req_zone $binary_remote_addr zone=n8n_admin:10m rate=3r/s;

# Webhook rate limiting (more permissive for integrations)
# limit_req_zone $binary_remote_addr zone=n8n_webhooks:10m rate=30r/s;

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name automation.tavardt.com;

    # SSL Certificate (via Certbot/Let's Encrypt)
    ssl_certificate     /etc/letsencrypt/live/automation.tavardt.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/automation.tavardt.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    # Security Headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # 1. Protect the n8n Editor Interface
    # Optionally restrict editor access to your agency's office IP only.
    location / {
        # limit_req zone=n8n_admin burst=5 nodelay;

        # IP Whitelist (Recommended for B2B environments)
        # allow 123.456.789.0/24;  # TAVARDT Office IP
        # deny all;

        proxy_pass http://127.0.0.1:5678;
        proxy_http_version 1.1;

        # Required for n8n WebSocket support (Live editor updates)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_hide_header X-Powered-By;
        
        # Increase timeouts for long-running workflow executions
        proxy_read_timeout 600s;
        proxy_connect_timeout 30s;
    }

    # 2. Expose Webhooks Publicly (with rate limiting)
    # n8n webhook paths follow the pattern /webhook/[uuid]
    location /webhook/ {
        # limit_req zone=n8n_webhooks burst=50 nodelay;
        
        proxy_pass http://127.0.0.1:5678;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# Redirect HTTP to HTTPS
server {
    listen 80;
    server_name automation.tavardt.com;
    return 301 https://$host$request_uri;
}
